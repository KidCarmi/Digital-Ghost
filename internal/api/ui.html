<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Ghost — Memory Search</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .container { max-width: 760px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 40px; }
  header h1 { font-size: 1.8rem; font-weight: 700; color: #a78bfa; letter-spacing: -0.02em; }
  header p  { color: #64748b; font-size: 0.9rem; margin-top: 6px; }

  .search-bar {
    display: flex; gap: 10px; margin-bottom: 32px;
  }
  .search-bar input {
    flex: 1;
    background: #1e2130;
    border: 1px solid #2d3148;
    border-radius: 10px;
    padding: 14px 18px;
    color: #e2e8f0;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-bar input:focus { border-color: #7c3aed; }
  .search-bar input::placeholder { color: #475569; }
  .search-bar button {
    background: #7c3aed;
    border: none;
    border-radius: 10px;
    padding: 14px 24px;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .search-bar button:hover { background: #6d28d9; }
  .search-bar button:disabled { background: #374151; cursor: default; }

  #status-bar {
    font-size: 0.8rem;
    color: #475569;
    text-align: center;
    margin-bottom: 28px;
  }
  #status-bar span { color: #a78bfa; font-weight: 600; }

  #results { display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: #1e2130;
    border: 1px solid #2d3148;
    border-radius: 12px;
    padding: 18px 20px;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: #4c1d95; }

  .card-meta {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.78rem; color: #64748b; margin-bottom: 10px;
  }
  .card-meta .app {
    background: #2d3148; border-radius: 6px;
    padding: 2px 8px; color: #a78bfa; font-weight: 600;
  }
  .card-meta .score {
    margin-left: auto; color: #34d399; font-weight: 600;
  }

  .card-desc {
    font-size: 0.95rem; line-height: 1.6; color: #cbd5e1;
  }

  .card-tags {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;
  }
  .card-tags span {
    background: #1a1f33; border: 1px solid #2d3148;
    border-radius: 20px; padding: 2px 10px;
    font-size: 0.73rem; color: #64748b;
  }

  .answer-box {
    background: #16213a;
    border: 1px solid #3730a3;
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 20px;
    line-height: 1.65;
    color: #e2e8f0;
    font-size: 0.97rem;
    position: relative;
  }
  .answer-box::before {
    content: "◉";
    color: #a78bfa;
    font-size: 0.75rem;
    margin-right: 8px;
  }
  .sources-label {
    font-size: 0.75rem;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    margin-top: 4px;
  }

  .empty { text-align: center; color: #475569; padding: 60px 0; font-size: 0.95rem; }
  .error { text-align: center; color: #f87171; padding: 40px 0; font-size: 0.9rem; }

  .manage-toggle {
    text-align: center; margin-bottom: 28px;
  }
  .manage-toggle button {
    background: none; border: 1px solid #2d3148; border-radius: 8px;
    color: #475569; font-size: 0.8rem; padding: 6px 14px; cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .manage-toggle button:hover { color: #94a3b8; border-color: #475569; }

  .manage-panel {
    background: #1a1f2e; border: 1px solid #2d3148; border-radius: 12px;
    padding: 18px 20px; margin-bottom: 28px; display: none;
  }
  .manage-panel h3 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: #475569; margin-bottom: 14px;
  }
  .manage-panel .delete-row {
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .manage-panel .del-btn {
    background: #1e2130; border: 1px solid #3d1f1f; border-radius: 8px;
    color: #f87171; font-size: 0.85rem; padding: 8px 16px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .manage-panel .del-btn:hover { background: #2a1a1a; border-color: #f87171; }
  .manage-panel .del-btn:disabled { opacity: 0.4; cursor: default; }
  .manage-panel .del-btn.all { border-color: #7f1d1d; color: #fca5a5; }
  .manage-panel .del-status {
    font-size: 0.8rem; color: #475569; margin-top: 10px; min-height: 1.2em;
  }

  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid #4c1d95; border-top-color: #a78bfa;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>◉ Digital Ghost</h1>
    <p>Search your local encrypted memory</p>
  </header>

  <div class="search-bar">
    <input id="q" type="text" placeholder="What were you working on?..." autofocus />
    <button id="btn" onclick="search()">Search</button>
  </div>

  <div id="status-bar">Loading status...</div>

  <div class="manage-toggle">
    <button onclick="toggleManage()">Manage memories</button>
  </div>

  <div class="manage-panel" id="manage-panel">
    <h3>Clear memories</h3>
    <div class="delete-row">
      <button class="del-btn" onclick="deleteRange('today')">Today</button>
      <button class="del-btn" onclick="deleteRange('week')">This week</button>
      <button class="del-btn" onclick="deleteRange('month')">This month</button>
      <button class="del-btn all" onclick="deleteRange('all')">All memories</button>
    </div>
    <div class="del-status" id="del-status"></div>
  </div>

  <div id="results"></div>
</div>

<script>
  const qEl  = document.getElementById('q');
  const btn  = document.getElementById('btn');
  const res  = document.getElementById('results');
  const stat = document.getElementById('status-bar');

  qEl.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

  async function loadStatus() {
    try {
      const r = await fetch('/api/status');
      const d = await r.json();
      stat.innerHTML = `<span>${d.nodes}</span> memories stored &nbsp;·&nbsp; model: <span>${d.model}</span>` +
        (d.last_capture ? ` &nbsp;·&nbsp; last capture: <span>${fmtTime(d.last_capture)}</span>` : '');
    } catch {
      stat.textContent = 'Daemon not reachable';
    }
  }

  async function search() {
    const q = qEl.value.trim();
    if (!q) return;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Thinking...';
    res.innerHTML = '';

    try {
      const r = await fetch('/api/chat?q=' + encodeURIComponent(q));
      const d = await r.json();
      if (!r.ok) { showError(d.error || 'Search failed'); return; }

      const hasSources = d.sources && d.sources.length > 0;
      if (!hasSources && !d.answer) {
        res.innerHTML = '<div class="empty">No memories found. DG may still be building your memory — try again in a minute.</div>';
        return;
      }

      let html = '';
      if (d.answer) {
        html += `<div class="answer-box">${esc(d.answer)}</div>`;
      }
      if (hasSources) {
        html += `<div class="sources-label">Memory sources</div>`;
        html += d.sources.map(renderCard).join('');
      }
      res.innerHTML = html;
    } catch (e) {
      showError('Could not reach Digital Ghost daemon.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Search';
    }
  }

  function renderCard(n) {
    const tags = (n.tags || []).map(t => `<span>${t}</span>`).join('');
    const pct  = n.similarity != null ? Math.round(n.similarity * 100) + '%' : '';
    return `
      <div class="card">
        <div class="card-meta">
          <span class="app">${esc(n.app || 'unknown')}</span>
          <span>${fmtTime(n.captured_at)}</span>
          ${n.window_title ? `<span>${esc(n.window_title)}</span>` : ''}
          ${pct ? `<span class="score">${pct}</span>` : ''}
        </div>
        <div class="card-desc">${esc(n.description)}</div>
        ${tags ? `<div class="card-tags">${tags}</div>` : ''}
      </div>`;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fmtTime(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleString();
    } catch { return iso; }
  }

  function showError(msg) {
    res.innerHTML = `<div class="error">${esc(msg)}</div>`;
  }

  function toggleManage() {
    const p = document.getElementById('manage-panel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
    document.getElementById('del-status').textContent = '';
  }

  const rangeLabels = { today: "today's", week: "this week's", month: "this month's", all: "all" };

  async function deleteRange(range) {
    const label = rangeLabels[range] || range;
    const confirmed = confirm(`Delete ${label} memories? This cannot be undone.`);
    if (!confirmed) return;

    const delStatus = document.getElementById('del-status');
    const btns = document.querySelectorAll('.del-btn');
    btns.forEach(b => b.disabled = true);
    delStatus.textContent = 'Deleting…';

    try {
      const r = await fetch('/api/delete?range=' + range, { method: 'POST' });
      const d = await r.json();
      if (!r.ok) {
        delStatus.textContent = 'Error: ' + (d.error || 'delete failed');
      } else {
        delStatus.textContent = `Deleted ${d.deleted} memor${d.deleted === 1 ? 'y' : 'ies'}.`;
        loadStatus();
      }
    } catch {
      delStatus.textContent = 'Could not reach daemon.';
    } finally {
      btns.forEach(b => b.disabled = false);
    }
  }

  loadStatus();
</script>
</body>
</html>
